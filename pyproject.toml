[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "mapa-midi"
version = "1.0.0"
description = "Inspeção local de MIDI, andamento exato e intervalos entre mensagens de nota."
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Martin Lofrano / LOFRANO TECNOLOGIA"}]
readme = "README.md"
dependencies = ["mido==1.3.3", "matplotlib==3.11.2"]

[project.scripts]
mapa-midi = "mapa_midi.cli:main"

[project.urls]
Homepage = "https://lofranotecnologia.com.br/"
Repository = "https://github.com/martinlofranodeoliveira/mapa-midi"

[tool.hatch.build.targets.wheel]
packages = ["src/mapa_midi"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/tools", "/scripts", "/fixtures", "/docs", "/examples", "/README.md", "/LICENSE", "/CONTRACT.md", "/CONTRIBUTING.md", "/THIRD_PARTY_NOTICES.md", "/pyproject.toml", "/.github", "/.gitignore", "/.gitattributes"]
