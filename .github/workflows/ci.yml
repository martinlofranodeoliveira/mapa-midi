name: Testes e distribuição
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: '3.11'}
          - {os: ubuntu-latest, python: '3.12'}
          - {os: ubuntu-latest, python: '3.13'}
          - {os: ubuntu-latest, python: '3.14'}
          - {os: windows-latest, python: '3.14'}
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: '1'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e . build==1.3.0
      - run: python -m unittest discover -s tests -v
      - run: python -m build
      - run: python scripts/check_release.py
      - run: python scripts/check_installed.py --wheel dist/mapa_midi-1.0.0-py3-none-any.whl
  midicsv:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - run: python tools/fetch_midicsv.py --destino "${{ runner.temp }}/midicsv-independent"
      - run: python tools/check_interop.py --live --tool-dir "${{ runner.temp }}/midicsv-independent/midicsv-1.1" --saida local/independent-ci
